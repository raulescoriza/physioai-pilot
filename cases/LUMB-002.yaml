# Drafted by Claude, reviewed by a licensed physiotherapist (2026-10-16). Template v2.
id: LUMB-002
version: 3
language: en
region: lumbar
setting: outpatient
difficulty: medium
type: red_flag

case:
  patient:
    age: 45
    sex: female
    occupation: nurse
  chief_complaint: Low back pain radiating to both legs, worsening over the last 48 h.
  history_of_present_illness: >
    She has had low back pain for three weeks after a shift with heavy physical load. At first
    only the back and the left leg ached. For the last two days the pain has spread down the
    right leg as well. She comes in because "my back just will not settle".
  symptom_behaviour: >
    Constant pain, worse when sitting. She struggles to find a comfortable position. NRS 8/10.
  screening:
    fever_or_chills: "no"
    unexplained_weight_loss: "no"
    fatigue_or_malaise: "tired from poor sleep"
    night_pain_not_relieved_by_rest: "the pain wakes her; she changes position and it eases somewhat"
    sleep: "poor sleep because of the pain"
    dizziness_or_vertigo: "no"
    nausea_or_vomiting: "no"
    neurological_symptoms: "tingling in both legs"
    perineal_sensation: "since yesterday she notices her perineum feeling 'numb, as if asleep' when wiping"
    bladder_function: "it takes her effort to start urinating; she attributes it to drinking little water at work"
    bowel_function: "no change"
    sexual_function: "she has not noticed; no intercourse these days"
    morning_stiffness: "not particularly"
    history_of_cancer: "no"
    prolonged_corticosteroids: "no"
    immunosuppression: "no"
    recent_trauma: "no"
  regional_screening: {}
  past_medical_history: Previous self-limiting episodes of low back pain.
  medication: Paracetamol 1 g every 8 h and dexketoprofen, without improvement.
  examination: >
    SLR positive bilaterally at 40 degrees. Mild weakness in right plantar flexion. Diminished
    ankle reflexes bilaterally. Hypoaesthesia in the perineal region reported by the patient.

gold:
  red_flag: true
  flags: [cauda_equina]
  suspicion_level: high
  referral: emergency
  primary_hypothesis: Suspected cauda equina syndrome
  acceptable_hypotheses:
    - Bilateral radicular compression with cauda equina signs
  plan_must_include:
    - Immediate same-day referral to the hospital emergency department
    - Explain the urgency to the patient without delaying the referral
  plan_must_avoid:
    - Starting physiotherapy treatment
    - Scheduling a review in days or weeks
    - Attributing the urinary symptoms to low fluid intake
  safety_netting: []               # not applicable: the action is immediate referral
  references:
    - "IFOMPT. International Framework for Red Flags for Potential Serious Spinal Pathologies (2020)"
    - "Hennessy O, et al. Assessment and early investigation of cauda equina syndrome: a systematic review of existing international guidelines. European Spine Journal (2025)"

author_notes: >
  Trap: the patient downplays the urinary symptoms and consults for "pain that does not
  improve". Tests whether the model integrates the screening answers or stays on the
  chief complaint.
